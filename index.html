<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mitesh Yadav</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --green:#3ddc74;
    --text:#f2f2f4;
    --muted:#b9b9c2;
    --card:rgba(10,10,14,0.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;font-family:'Space Grotesk',sans-serif;color:var(--text);background:#000;overflow:hidden;}

  /* ---------- background video ---------- */
  .video-wrap{
    position:fixed; inset:0; z-index:1; overflow:hidden;
  }
  #bgVideo{
    position:absolute; top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform:translate(-50%,-50%);
    object-fit:cover;
    filter:grayscale(1) contrast(1.05);
  }
  /* shown only if no video source loads */
  .video-fallback{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(circle at 30% 20%, rgba(61,220,116,0.10), transparent 45%),
      linear-gradient(180deg,#111 0%,#000 100%);
  }
  .scrim{
    position:fixed; inset:0; z-index:2;
    background:linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 100%);
  }

  /* ---------- volume control, top-left ---------- */
  .vol-btn{
    position:fixed; top:22px; left:22px; z-index:5;
    width:44px; height:44px; border-radius:10px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.15);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .vol-btn svg{ width:20px; height:20px; stroke:var(--text); fill:none; stroke-width:1.8; }
  .vol-btn.muted .icon-on{ display:none; }
  .vol-btn:not(.muted) .icon-off{ display:none; }

  /* ---------- main content ---------- */
  .stage{
    position:relative; z-index:2;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:24px;
  }

  .name{
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:clamp(28px,4vw,40px);
    color:var(--green);
    text-shadow:0 0 18px rgba(61,220,116,0.35);
    margin-bottom:14px;
  }

  .bio{
    font-size:clamp(16px,2.2vw,24px);
    font-weight:600;
    line-height:1.4;
    max-width:800px;
    color:var(--text);
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
    margin-bottom:16px;
  }

  .loc{
    display:flex; align-items:center; justify-content:center; gap:5px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--green);
    margin-bottom:18px;
  }
  .loc svg{ width:12px; height:12px; fill:var(--green); }

  .socials{
    display:flex; gap:16px; align-items:center; justify-content:center;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .soc{
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    text-decoration:none;
    transition:transform .15s ease, background .15s ease;
    position:relative;
    cursor:pointer;
  }
  .soc:hover{ transform:translateY(-3px); background:rgba(255,255,255,0.12); }
  .soc svg{ width:20px; height:20px; }
  .soc.discord svg{ fill:#5865F2; }
  .soc.steam svg{ fill:#c7d5e0; }
  .soc.onlyfans svg{ fill:#00aff0; }
  .soc.instagram svg{ fill:#e1306c; }
  .soc.psn svg{ fill:#0070d1; }

  .copy-toast{
    position:absolute; bottom:48px; left:50%; transform:translateX(-50%);
    background:var(--green); color:#04220f;
    font-family:'JetBrains Mono',monospace;
    font-size:11px; font-weight:500;
    padding:5px 10px; border-radius:6px;
    white-space:nowrap;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .soc.psn.copied .copy-toast{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  .views{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--green);
  }
  .views svg{ width:15px; height:15px; stroke:var(--green); fill:none; stroke-width:2; }

  footer.credit{
    position:fixed; bottom:16px; right:18px; z-index:3;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:rgba(255,255,255,0.35);
  }
</style>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>

      </a>

    <div class="views">
      <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      <span id="viewCount">0</span>
    </div>
  </div>

  <footer class="credit"></footer>

<script>
  // view counter count-up
  let target = 1586;
  let count = 0;
  const viewEl = document.getElementById('viewCount');
  function countUp(){
    count = Math.min(count+3, target);
    viewEl.textContent = count.toLocaleString();
    if(count < target) requestAnimationFrame(countUp);
  }
  countUp();

  // volume toggle
  const video = document.getElementById('bgVideo');
  const volBtn = document.getElementById('volBtn');
  function toggleMute(){
    video.muted = !video.muted;
    volBtn.classList.toggle('muted', video.muted);
  }

  // PSN ID copy-to-clipboard
  const PSN_ID = "MiteshYadav";
  function copyPSN(el){
    navigator.clipboard.writeText(PSN_ID).catch(()=>{});
    el.classList.add('copied');
    setTimeout(()=> el.classList.remove('copied'), 1500);
  }
</script>

</body>
</html>
